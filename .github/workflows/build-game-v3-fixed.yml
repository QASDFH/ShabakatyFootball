name: Build Football Game V3 Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check V3 ZIP
        run: |
          test -f ShabakatyFootball_Game_V3_READY.zip
          unzip -t ShabakatyFootball_Game_V3_READY.zip

      - name: Extract V3
        run: |
          rm -rf game
          mkdir game
          unzip -q ShabakatyFootball_Game_V3_READY.zip -d game
          test -f game/settings.gradle
          test -f game/app/build.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: game
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShabakatyFootball-Game-V3-Fixed
          path: game/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
