name: Build Football Game V3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract V3 game
        run: |
          unzip -q ShabakatyFootball_Game_V3_READY.zip -d game

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build V3 APK
        run: |
          cd game
          gradle assembleDebug --no-daemon

      - name: Upload V3 APK
        uses: actions/upload-artifact@v4
        with:
          name: ShabakatyFootball-Game-V3
          path: game/app/build/outputs/apk/debug/app-debug.apk
